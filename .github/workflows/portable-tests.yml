name: Portable source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Authenticated configuration and archives
        run: node scripts/test-linux-encrypted-store.cjs
      - name: Operating system routing
        run: node scripts/test-linux-launch.cjs
      - name: Linux session lifecycle
        if: runner.os == 'Linux'
        run: node scripts/test-linux-session.cjs
      - name: Linux native proxy ownership
        if: runner.os == 'Linux'
        run: node scripts/test-linux-native-proxy.cjs
      - name: Linux AppArmor authorization and cancellation
        if: runner.os == 'Linux'
        run: node scripts/test-linux-userns.cjs
      - name: Linux bootstrap authorization workflow
        if: runner.os == 'Linux'
        run: node scripts/test-linux-bootstrap-userns.cjs
      - name: Linux temporary AppArmor policy lifecycle
        if: runner.os == 'Linux'
        run: node scripts/test-linux-userns-privileged.cjs --allow-policy-test
      - name: Linux runtime manifest and upgrade persistence
        if: runner.os == 'Linux'
        run: node scripts/test-linux-runtime.cjs --unit-only
      - name: Windows protected session authentication
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $testProcess = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './scripts/test-cc-switch-ipc.ps1') -WorkingDirectory $PWD.Path -NoNewWindow -PassThru -Wait
          $testProcess.Refresh()
          $testExitCode = $testProcess.ExitCode
          if ($null -eq $testExitCode) { throw 'Could not read the Windows IPC test process exit code.' }
          Write-Host "Windows IPC test process exited with code $testExitCode."
          exit $testExitCode
